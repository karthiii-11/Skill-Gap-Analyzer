<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome - Skill Gap Analyzer</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f6f8fc;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .card {
            background: white;
            border: 1px solid #dbe3ef;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.07);
            width: min(90%, 420px);
        }
        h1 {
            margin: 0 0 8px;
            color: #4f46e5;
            text-align: center;
        }
        p {
            text-align: center;
            color: #64748b;
            margin-bottom: 25px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #dbe3ef;
            border-radius: 8px;
            font-size: 16px;
            margin-bottom: 20px;
        }
        .options {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
        }
        .option {
            flex: 1;
            padding: 14px;
            border: 1px solid #dbe3ef;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
        }
        .option input {
            margin-right: 6px;
        }
        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #4f46e5;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            background: #3730a3;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Welcome</h1>
        <p>Let's personalize your experience</p>

        <form method="POST">
            {% csrf_token %}

            <label for="name">Your Name</label>
            <input type="text" id="name" name="name" required>

            <label>Are you a Fresher or Experienced?</label>
            <div class="options">
                <label class="option">
                    <input type="radio" name="status" value="FRESHER" checked>
                    Fresher
                </label>
                <label class="option">
                    <input type="radio" name="status" value="EXPERIENCED">
                    Experienced
                </label>
            </div>

            <button type="submit">Continue</button>
        </form>
    </div>
</body>
</html>
